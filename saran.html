<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kritik & Saran - Digimalz.id</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="saran.css">
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar contact-navbar">

    <button
      type="button"
      class="back-btn"
      onclick="history.back()"
      aria-label="Kembali"
    >
      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <h1>Kritik & Saran</h1>

  </nav>
  <!-- ===== END NAVBAR ===== -->


  <!-- ===== HALAMAN SARAN ===== -->
  <main class="saran-page">

  <!-- ===== HERO SARAN ===== -->
<section class="saran-hero">

  <div class="saran-hero-icon">
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 11v2a2 2 0 0 0 2 2h1l2 5h2l-1.7-5H9l9 3V6l-9 3H5a2 2 0 0 0-2 2Z"/>
    <path d="M18 9.5a4 4 0 0 1 0 5"/>
  </svg>
  </div>

  <h2>Kritik & Saran</h2>

  <p>
    Bantu kami menjadi lebih baik dengan menyampaikan
    kritik, saran, atau masukan untuk Digimalz.id.
  </p>

</section>

    <!-- FORM -->
    <section class="saran-card">

      <form id="saranForm">

        <!-- EMAIL -->
        <div class="form-group">

          <label for="email">
            Email
            <span>(Opsional)</span>
          </label>

          <div class="input-wrapper">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <polyline points="3 7 12 13 21 7"></polyline>
            </svg>

            <input
              type="email"
              id="email"
              placeholder="Masukkan email kamu"
              autocomplete="email"
            >

          </div>

        </div>


        <!-- SARAN -->
        <div class="form-group">

          <label for="saran">
            Kritik & Saran
          </label>

          <div class="textarea-wrapper">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
            </svg>

            <textarea
              id="saran"
              placeholder="Tuliskan kritik atau saran kamu..."
              maxlength="1000"
            ></textarea>

          </div>

          <div class="char-count">
            <span id="charCount">0</span>/1000
          </div>

        </div>


        <!-- BUTTON -->
        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >

          <span class="btn-text">
            Kirim Masukan
          </span>

          <svg
            class="btn-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>

        </button>

      </form>


      <!-- SUCCESS -->
      <div class="success-message" id="successMessage">

        <div class="success-icon">

          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>

        </div>

        <strong>Masukan berhasil dikirim</strong>

        <p>
          Terima kasih sudah membantu Digimalz.id menjadi lebih baik.
        </p>

      </div>

    </section>

  </main>


  <script src="saran.js"></script>

</body>
</html>
