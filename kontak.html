<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Kami - Digimalz.id</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="kontak.css">
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar contact-navbar">

    <button
      type="button"
      class="back-btn"
      onclick="history.back()"
      aria-label="Kembali"
    >
      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <h1>Contact Kami</h1>

  </nav>
  <!-- ===== END NAVBAR ===== -->


  <main class="contact-page">

  <!-- ===== HERO CONTACT ===== -->
  <section class="contact-hero">

    <img src="icon/cs.png" alt="Customer Service" class="contact-hero-icon">

    <h2>Halaman Kontak Kami</h2>

    <p>
      Silahkan hubungi kami sesuai dengan jam operasional yang telah ditentukan,
      tidak menerima telepon/VC WhatsApp.
    </p>

  </section>


  <!-- ===== DAFTAR CONTACT ===== -->
  <section class="contact-list">

    <!-- EMAIL -->
    <a href="mailto:admin@digimalz.id" class="contact-item">
      <div class="contact-item-icon">
        <span>✉</span>
      </div>
      <div class="contact-item-info">
        <strong>Email</strong>
        <small>admin@digimalz.id</small>
      </div>
      <span class="contact-arrow">›</span>
    </a>


    <!-- WHATSAPP -->
    <a href="https://wa.me/6281234567890" class="contact-item" target="_blank">
      <div class="contact-item-icon">
        <span>☏</span>
      </div>
      <div class="contact-item-info">
        <strong>WhatsApp</strong>
        <small>+62 812-3456-7890</small>
      </div>
      <span class="contact-arrow">›</span>
    </a>


    <!-- TELEGRAM -->
    <a href="#" class="contact-item">
      <div class="contact-item-icon">
        <span>➤</span>
      </div>
      <div class="contact-item-info">
        <strong>Telegram</strong>
        <small>@digimalz_official</small>
      </div>
      <span class="contact-arrow">›</span>
    </a>


    <!-- INSTAGRAM -->
    <a href="#" class="contact-item">
      <div class="contact-item-icon">
        <span>◎</span>
      </div>
      <div class="contact-item-info">
        <strong>Instagram</strong>
        <small>@digimalz.id</small>
      </div>
      <span class="contact-arrow">›</span>
    </a>


    <!-- TIKTOK -->
    <a href="#" class="contact-item">
      <div class="contact-item-icon">
        <span>♪</span>
      </div>
      <div class="contact-item-info">
        <strong>TikTok</strong>
        <small>@digimalz.id</small>
      </div>
      <span class="contact-arrow">›</span>
    </a>

  </section>

</main>


  <script src="script.js"></script>

</body>
</html>
