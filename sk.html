<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syarat & Ketentuan - Digimalz.id</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #EAF2FB;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .notice-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 25px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .warning {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 25px;
    }

    .back-button {
      display: block;
      width: 100%;
      padding: 13px 20px;
      border-radius: 12px;
      background: #038df2;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    .back-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <div class="notice-box">

    <div class="warning">⚠️</div>

    <h1>Mohon Maaf</h1>

    <p>
      Halaman Syarat dan Ketentuan masih dalam proses pembuatan oleh admin.
      Silahkan cek kembali 1-3 hari ke depan.
      <br><br>
      Terima kasih atas pengertiannya.
    </p>

    <a href="https://digimalz.my.id" class="back-button">
      Kembali ke Dashboard
    </a>

  </div>

</body>
  </html>
